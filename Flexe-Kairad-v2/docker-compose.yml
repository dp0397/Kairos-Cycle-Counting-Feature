services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kairad
      POSTGRES_PASSWORD: kairad_dev
      POSTGRES_DB: flexe_kairad_v2
    # Own host port so this stack can run beside the original CWC app.
    ports: ["5492:5432"]
    volumes: [flexe_v2_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairad"]
      interval: 5s
      retries: 10

volumes:
  flexe_v2_pgdata:
